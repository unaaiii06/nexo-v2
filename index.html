<!doctype html>
<html lang="es" data-theme="obsidian">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nexo" />
    <meta name="application-name" content="Nexo" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Tu organización personal: día, semana y mes." />
    <meta name="theme-color" content="#070709" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Nexo</title>
    <script>
      // Aplica el último tema (con su personalización) antes de pintar, sin parpadeos.
      (function () {
        try {
          var c = JSON.parse(localStorage.getItem('nexo2:theme-vars') || 'null');
          if (!c) return;
          var r = document.documentElement;
          for (var k in c.v) r.style.setProperty(k, c.v[k]);
          r.style.colorScheme = c.s;
          r.dataset.theme = c.t;
          r.dataset.ambient = c.a;
          r.dataset.motion = c.m;
          document.querySelector('meta[name="theme-color"]').setAttribute('content', c.v['--bg']);
          document.querySelector('link[rel="icon"]').setAttribute('href', './icons/' + c.t + '.svg');
          document.querySelector('link[rel="apple-touch-icon"]').setAttribute('href', './icons/' + c.t + '-180.png');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
